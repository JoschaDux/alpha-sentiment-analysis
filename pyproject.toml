[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-sentiment-analysis"
version = "0.1.0"
description = "Textual analysis of SEC 10-K filings for stock-return prediction research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "yfinance>=0.2.36",
]

[tool.setuptools.packages.find]
where = ["src"]
